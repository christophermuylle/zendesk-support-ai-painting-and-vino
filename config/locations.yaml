# ---------------------------------------------------------------------------
# Managed locations - Painting and Vino
# ---------------------------------------------------------------------------
# Checked top to bottom against the ticket subject + latest customer
# message; first match wins. Each location's pricing/booking/venue details
# live in their own file under config/knowledge-base/locations/<file>,
# combined with config/knowledge-base/shared.md when the AI drafts a reply.
#
# NOTE: sourced from https://paintingandvino.com/locations/ and each
# location's own page - confirm these are current and complete.
#
# FLAGGED FOR YOU:
#  - Phoenix, AZ and Temecula, CA currently show no scheduled events on
#    their pages ("0 events found") - may be inactive/newly launched.
#    Temecula appears to be covered by the Riverside County page/team
#    rather than having its own calendar - confirmed with a match keyword
#    below, but double check this is still accurate.
#  - Chattanooga, TN is listed as "coming soon" (per you, Sep 2026) - no
#    page/content exists yet, so its file just tells the AI to say it's
#    not open yet rather than guessing.
#  - Does Painting and Vino have any self-managed/excluded locations, the
#    way some Wine and Canvas locations do? None identified yet - if there
#    are any, add an out_of_scope_location rule to rules.yaml like the
#    Wine and Canvas deployment has.
# ---------------------------------------------------------------------------

locations:
  - slug: tucson
    display_name: "Tucson, AZ"
    file: tucson.md
    match_keywords: ["tucson", "oro valley"]

  - slug: phoenix
    display_name: "Phoenix, AZ"
    file: phoenix.md
    match_keywords: ["phoenix"]

  - slug: los-angeles
    display_name: "Los Angeles, CA"
    file: los-angeles.md
    # All 88 incorporated Los Angeles County cities PLUS all 24 San
    # Bernardino County cities - Christopher, 2026-10-01: "Los Angeles
    # County - Los Angeles County, San Bernardino County" / "All cities in
    # those COunties". San Bernardino has no key of its own, so it prices and
    # presents as Los Angeles.
    #
    # State-qualified, because bare they are words before they are places:
    # avalon, bell, carson, commerce, city of industry, gardena, paramount,
    # south gate, torrance, vernon, walnut, lynwood, colton, highland,
    # needles, ontario (Canada), upland, joshua tree (a painting title if
    # ever there was one), and glendale (Glendale, AZ is a Phoenix suburb).
    #
    # KNOWN EDGE CASE: "ontario, ca" also matches "Ontario, Canada" as a
    # substring. Kept anyway - "Ontario, CA" is how a real San Bernardino
    # customer writes it, and a Canadian booking a California paint party is
    # not a case worth losing that recall for. A word-boundary matcher in
    # src/locations.ts would fix this class of problem properly.
    match_keywords: [
      "los angeles", "l.a. county", "la county", "arcadia, ca", "arcadia ca", "san marino, ca", "san marino ca", "agoura hills", "alhambra", "artesia", "azusa",
      "baldwin park", "bell gardens", "bellflower", "beverly hills", "bradbury", "burbank",
      "calabasas", "cerritos", "claremont", "compton", "covina", "cudahy", "culver city",
      "diamond bar", "downey", "duarte", "el segundo", "glendora", "hawaiian gardens", "hawthorne",
      "hermosa beach", "hidden hills", "huntington park", "inglewood", "irwindale",
      "la canada flintridge", "la cañada flintridge", "la habra heights", "la mirada", "la puente",
      "la verne", "lakewood", "lancaster", "lawndale", "lomita", "long beach", "malibu",
      "manhattan beach", "maywood", "monrovia", "montebello", "monterey park", "norwalk", "palmdale",
      "palos verdes estates", "pico rivera", "pomona", "rancho palos verdes", "redondo beach",
      "rolling hills", "rolling hills estates", "rosemead", "san dimas", "san fernando", "san gabriel",
      "santa clarita", "santa fe springs", "santa monica", "sierra madre", "signal hill",
      "south el monte", "south pasadena", "temple city", "west covina", "west hollywood",
      "westlake village", "whittier", "el monte", "pasadena", "san bernardino county", "adelanto",
      "apple valley", "barstow", "big bear lake", "chino", "chino hills", "fontana", "grand terrace",
      "hesperia", "loma linda", "montclair", "rancho cucamonga", "redlands", "rialto",
      "san bernardino", "twentynine palms", "victorville", "yucaipa", "yucca valley", "avalon, ca",
      "avalon ca", "bell, ca", "bell ca", "carson, ca", "carson ca", "commerce, ca", "commerce ca",
      "city of industry", "industry, ca", "industry ca", "glendale, ca", "glendale ca", "gardena, ca",
      "gardena ca", "paramount, ca", "paramount ca", "south gate, ca", "south gate ca", "torrance, ca",
      "torrance ca", "vernon, ca", "vernon ca", "walnut, ca", "walnut ca", "lynwood, ca", "lynwood ca",
      "colton, ca", "colton ca", "highland, ca", "highland ca", "needles, ca", "needles ca",
      "ontario, ca", "ontario ca", "upland, ca", "upland ca", "joshua tree, ca", "joshua tree ca"
    ]

  - slug: orange-county
    display_name: "Orange County, CA"
    file: orange-county.md
    # All 34 incorporated Orange County cities (Christopher, 2026-10-01:
    # "All cities in those COunties"). Seven are state-qualified because the
    # matcher is a plain substring test: "brea" is inside "bread" and
    # "break", "orange" is a colour that appears in half our paint
    # descriptions, "cypress" and "lake forest" read as painting titles, and
    # "stanton", "villa park" and "westminster" are names or venues as often
    # as places.
    match_keywords: [
      "orange county", "aliso viejo", "anaheim", "buena park", "costa mesa", "dana point",
      "fountain valley", "fullerton", "garden grove", "huntington beach", "irvine", "la habra",
      "la palma", "laguna beach", "laguna hills", "laguna niguel", "laguna woods", "los alamitos",
      "mission viejo", "newport beach", "placentia", "rancho santa margarita", "san clemente",
      "san juan capistrano", "santa ana", "seal beach", "sunset beach", "tustin", "yorba linda", "brea, ca", "brea ca",
      "cypress, ca", "cypress ca", "lake forest, ca", "lake forest ca", "stanton, ca", "stanton ca",
      "villa park, ca", "villa park ca", "westminster, ca", "westminster ca", "orange, ca",
      "orange ca"
    ]

  - slug: sacramento
    display_name: "Sacramento, CA"
    file: sacramento.md
    match_keywords: ["sacramento", "rocklin", "roseville", "lincoln, ca", "woodland, ca"]

  # North County San Diego added 2026-09-24 after ticket #81313 (Palomar
  # College, dropdown choice "Vista, CA", campus in San Marcos) came in
  # tagged private_event_needs_location - the county's inland and northern
  # cities weren't listed, so nothing matched and the quote had to be sent
  # by hand. Christopher: "Vista is in San Diego County. This ticket needs
  # the quote for San Diego with a possible travel fee." The travel-fee
  # line is already part of every San Diego quote template.
  #
  # "vista, ca" and "san marcos, ca" are written with the state attached on
  # purpose: bare "vista" would also fire on Buena Vista/Monte Vista
  # anywhere in the country, and there is a San Marcos, TX. The qualified
  # form still matches "San Marcos, California" as well as ", CA".
  - slug: san-diego
    display_name: "San Diego, CA"
    file: san-diego.md
    match_keywords:
      [
        "san diego",
        "la jolla",
        "carlsbad",
        "del mar",
        "vista, ca",
        "san marcos, ca",
        "escondido",
        "oceanside",
        "encinitas",
        "poway",
        "chula vista",
        "el cajon",
        # The rest of San Diego County's 18 incorporated cities
        # (Christopher, 2026-10-01). "coronado" is safe here even though
        # Riverside's "corona, ca" looks similar - that keyword carries the
        # comma, so neither city can steal the other's tickets, and san-diego
        # is matched before riverside-county anyway.
        "coronado",
        "imperial beach",
        "la mesa",
        "lemon grove",
        "national city",
        "santee",
        "solana beach",
        # Comma-less twins for the two that were state-qualified. Same bug as
        # the Indianapolis suburbs had: withStateAbbreviations turns "Vista
        # California" into "vista ca" with no comma, so "vista, ca" alone
        # could never match it.
        "vista ca",
        "san marcos ca",
        # Unincorporated San Diego County communities (Christopher,
        # 2026-10-01). Five of the eight are state-qualified: "alpine" and
        # "lakeside" are landscape words that belong in painting titles,
        # "julian" and "ramona" are first names and the form body carries the
        # customer's own name, and "valley center" is generic enough to
        # collide (there is one near Wichita, and we serve Kansas City).
        "borrego springs",
        "fallbrook",
        "rancho santa fe",
        "alpine, ca",
        "alpine ca",
        "julian, ca",
        "julian ca",
        "lakeside, ca",
        "lakeside ca",
        "ramona, ca",
        "ramona ca",
        "valley center, ca",
        "valley center ca",
      ]

  - slug: san-francisco-bay
    display_name: "San Francisco Bay Area, CA"
    file: san-francisco-bay.md
    match_keywords: ["san francisco", "bay area", "sf bay", "pacifica", "menlo park", "scotts valley", "redwood city", "san jose"]

  - slug: riverside-county
    display_name: "Riverside County, CA"
    file: riverside-county.md
    # All 28 incorporated Riverside County cities. "banning" is a verb,
    # "corona" and "canyon lake" are a drink and a painting title, so those
    # are state-qualified.
    match_keywords: [
      "riverside county", "beaumont", "blythe", "calimesa", "cathedral city", "coachella",
      "desert hot springs", "eastvale", "hemet", "indian wells", "indio", "jurupa valley", "la quinta",
      "lake elsinore", "menifee", "moreno valley", "murrieta", "norco", "palm desert", "palm springs",
      "perris", "rancho mirage", "san jacinto", "temecula", "wildomar", "banning, ca", "banning ca",
      "canyon lake, ca", "canyon lake ca", "corona, ca", "corona ca", "riverside, ca", "riverside ca"
    ]

  - slug: kansas-city
    display_name: "Kansas City, MO"
    file: kansas-city.md
    match_keywords: ["kansas city", "lee's summit", "lees summit", "kearney, mo"]

  - slug: chattanooga
    display_name: "Chattanooga, TN"
    file: chattanooga.md
    match_keywords: ["chattanooga"]
