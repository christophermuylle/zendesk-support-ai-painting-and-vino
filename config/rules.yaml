# ---------------------------------------------------------------------------
# Support automation rules
# ---------------------------------------------------------------------------
# Rules are checked TOP TO BOTTOM against the latest customer message in the
# ticket. The first rule that matches wins - order matters, put your most
# specific / highest-priority rules first (e.g. "angry customer" before a
# generic FAQ catch-all).
#
# match:
#   any_keywords     - fires if the message contains ANY of these (case-insensitive)
#   all_keywords     - fires only if the message contains ALL of these
#   tags             - fires if the ticket already has any of these Zendesk tags
#
# action: solve | pending | escalate | no_action | order_confirmation |
#         licensee_initial_response
#   solve               - AI answers the question and the ticket is marked Solved
#   pending             - AI replies (usually asking for info) and ticket goes to
#                         Pending, i.e. "waiting on the customer"
#   escalate            - ticket is left Open, tagged, and ALWAYS held for a human -
#                         even in auto mode. Use this for anything with money, legal,
#                         or brand-reputation risk.
#   no_action           - completely hands off: no AI call, no reply, no status
#                         change. Only tags are applied (if set). Use this for
#                         tickets that are out of scope entirely - e.g. locations
#                         you don't provide support for.
#   order_confirmation  - for automated "New order" notification tickets, not a
#                         real support question: no AI call, no reply of any
#                         kind (draft or auto mode). Sets the "Reason for
#                         Customer Contacting Us" field to Order Confirmation
#                         (which also auto-applies the order_confirmation tag),
#                         then Solves the ticket if the order total is > $0, or
#                         leaves it Open for Bonnie if it's $0/unparseable. See
#                         src/pipeline.ts's order_confirmation branch.
#   licensee_initial_response - for automated "New submission from Licensee
#                         Application" notification tickets, not a real
#                         support question: no AI call. Posts the fixed
#                         "please respond RECEIVED" reply (matching Zendesk's
#                         own "Licensee Initial Response" macro verbatim),
#                         sets the "Reason for Customer Contacting Us" field
#                         to Artist, Licensee or Venue, and Solves the
#                         ticket - in both draft and auto mode, since it's a
#                         fixed template, not an AI judgment call. See
#                         src/pipeline.ts's licensee_initial_response branch.
#
# force_human_review: true means this rule NEVER auto-sends, regardless of MODE.
# add_tags: tags to stamp on the ticket when this rule fires (for reporting).
# drafting_hint: extra instruction passed to the AI when it writes the reply.
#
# Matching runs against the ticket SUBJECT plus the latest customer message,
# so a location that only shows up in the subject line (e.g. from a
# location-specific contact form) is still caught.
#
# SCOPE (Christopher, 2026-09-13): only draft AI replies for Private Event
# inquiries (event_booking_question) and ticket/order confirmations
# (new_order_confirmation). Everything else below is set to no_action -
# tagged and left Open for a human, no AI call, no reply of any kind - even
# though several of these rules used to draft (see git history). This was
# the original intent from day one; it had drifted as more rule categories
# got added. Do not add solve/pending/escalate actions outside those two
# categories without Christopher explicitly asking again.
# ---------------------------------------------------------------------------

rules:
  # No Painting and Vino locations have been identified as self-managed /
  # out of scope yet (unlike Wine and Canvas, which excludes several - see
  # that deployment's rules.yaml for the pattern). If that changes, add an
  # "out_of_scope_location" rule here the same way, as the very first rule
  # in this file, matching on the location's name the way locations.yaml
  # does, with action: no_action.

  # Automated "New order" notification tickets from the storefront - these
  # are order receipts Zendesk turns into tickets, not a real customer
  # question, so this is matched and handled first (Christopher's rule:
  # "Tickets with 'New order' in the subject line or in the description
  # should be set to 'Order Confirmation' and status set to 'solved' only
  # if the order total is greater than $0. If it is $0 leave it open for
  # Bonnie to handle." - no AI reply draft). See action doc above.
  - name: new_order_confirmation
    match:
      any_keywords: ["new order"]
    action: order_confirmation
    force_human_review: false

  # Automated "New submission from Licensee Application" notification
  # tickets from the storefront's licensee application form - these are
  # form-fill notifications, not a real support question, so this is
  # matched and handled right after order confirmations (Christopher's
  # rule: "New submission from Licensee Application emails. Send Painting
  # and Vino's initial licensee response and have it include the following
  # snippet: Please respond with 'RECEIVED' so we know you are receiving
  # our responses. This will help us confirm the emails are hitting their
  # inbox." - confirmed via Zendesk's own "Licensee Initial Response" macro
  # and real tickets #81030/#81022, where Christopher sends exactly this
  # text by hand every time). Painting and Vino only for now - not ported
  # to Wine and Canvas unless asked. See action doc above.
  - name: licensee_initial_response
    match:
      any_keywords: ["new submission from licensee application"]
    action: licensee_initial_response
    force_human_review: false

  - name: refund_or_cancellation_request
    match:
      any_keywords: ["refund", "cancel my", "cancellation", "money back", "chargeback"]
    action: no_action
    force_human_review: false
    add_tags: ["needs_human", "refund_request"]

  - name: angry_or_upset_customer
    match:
      any_keywords: ["unacceptable", "furious", "scam", "lawsuit", "terrible experience", "worst"]
    action: no_action
    force_human_review: false
    add_tags: ["needs_human", "upset_customer"]

  - name: licensee_recruitment_inquiry
    match:
      any_keywords: ["become a licensee", "open a franchise", "start my own", "how do i become", "territory"]
    action: no_action
    force_human_review: false
    add_tags: ["licensee_lead"]

  - name: groupon_or_promo_code
    match:
      any_keywords: ["groupon", "livingsocial", "living social", "voucher", "bogo", "buy one get one", "promo code", "discount code"]
    action: no_action
    force_human_review: false
    add_tags: ["promo_code_question"]

  - name: event_booking_question
    match:
      # "party request", "guests:", "preferred date" added 2026-09-13 after
      # Wine and Canvas ticket #28740 ("Party Request from Sarah Taylor")
      # fell through to general_faq unmatched - real Private Event
      # inquiries come in via a location's contact form as "Party Request
      # from [Name]" with structured Name/Email/Guests/Preferred
      # Date/Location fields, not the phrases below, so they need their own
      # keywords. Applied here too in case Painting and Vino's contact form
      # uses the same format - confirm against a real ticket and adjust if
      # the wording differs.
      # "team building", "corporate event", "party of", "birthday party"
      # added 2026-09-15 after Christopher's own test ticket ("I'd like to
      # book a corporate team building event in Tucson for a party of 10
      # people") fell through to fallback_unclassified - "book a[n] ...
      # event" phrasing with a qualifier in the middle doesn't match "book
      # an event", and "party of 10" doesn't match "party request", so a
      # very ordinary corporate/team-building or birthday inquiry could
      # silently miss the AI draft entirely and just sit tagged
      # needs_human/unclassified instead of booking_question. This is
      # plain substring matching (see src/rules.ts) - no wildcards - so
      # each real-world phrasing needs its own literal keyword.
      # "private party" added 2026-09-15 after another of Christopher's
      # test tickets ("I have a group of 6 people for a private party in
      # Los Angeles") also fell through to fallback_unclassified - "private
      # party" doesn't match "private event", and "group of 6 people"
      # doesn't match "party of" either. Since location resolution only
      # runs once a rule actually needs the knowledge base (see
      # pipeline.ts), missing this keyword also meant Los Angeles never
      # got matched as a location, even though it was right there in the
      # subject line.
      # "birthday", "bachelorette", "bachelor party", "anniversary",
      # "celebration", "painting event", "paint night" added 2026-09-18
      # after Christopher tested FOUR more realistic phrasings and every
      # single one fell through to fallback_unclassified: "birthday bash"
      # (no "party"), "bachelorette party" (not covered by any keyword),
      # "painting event for our office" (no "corporate"/"team
      # building"/"private event"), and "Sweet 16 birthday" (no "kid's
      # birthday"/"birthday party" phrasing). This confirmed the pattern
      # is systemic, not one-off: shared.md's own Step 1 explicitly lists
      # "birthdays, bachelorette/bridal, anniversaries, family/friend
      # celebrations" as in-scope Standard private events, but several of
      # those words were never in this keyword list at all. Broadened
      # deliberately toward higher recall here (some risk of matching an
      # unrelated FAQ that happens to mention "birthday" or
      # "celebration") because the drafting_hint below already has a
      # graceful fallback for that case ("a general public booking/
      # date-availability question that ISN'T a private event quote, just
      # point them to the booking page") - a false match here costs an
      # unnecessary internal draft a human ignores; a missed match costs
      # a real quote request going completely unanswered, which is worse.
      any_keywords: ["book an event", "book a class", "private event", "private party", "date availability", "how do i book", "party request", "guests:", "preferred date", "fundraiser", "fundraising", "kid's birthday", "children's birthday", "kids party", "painting & kiddos", "team building", "corporate event", "party of", "birthday party", "birthday", "bachelorette", "bachelor party", "anniversary", "celebration", "painting event", "paint night"]
    action: pending
    force_human_review: true
    add_tags: ["booking_question"]
    drafting_hint: >
      First check the shared knowledge base's Private events Step 0a: if
      this is a request to plan a fundraiser/charity/benefit painting
      party (mentions "fundraiser", "fundraising", "charity", "benefit",
      "nonprofit", "donate"/"donation", or "cause"), use that section's
      literal Fundraiser quote template verbatim, filling in only the
      bracketed placeholders - do not paraphrase or restructure it, and
      skip everything below (Standard vs Corporate doesn't apply to
      fundraisers). Otherwise check Step 0b: if this is specifically a
      kids' birthday/party request (the requester states a child's age
      of 16 or under, or wording like "kid's birthday", "child's
      birthday", "son's/daughter's birthday", "kids party", "Painting &
      Kiddos"), use that section's literal Painting & Kiddos quote
      template verbatim, filling in only the bracketed placeholders
      (reusing the same [VENUE_PARAGRAPH]/[MIN]/[TRAVEL_FEE_LINE] fill
      logic as the Standard template below) - also skip everything below
      for these. Otherwise, if this is a private/corporate event
      pricing inquiry (a "Private Event Request"-style submission - guest
      count, event date, company name, "team building"/"corporate"/
      "celebration" language), draft a full quote reply following the
      shared knowledge base's Private events section - this maps to one
      of two real Zendesk macros ("Private Event Inquiry -
      Corporate/Business Quote" vs "... Standard Quote"), picked using
      the form's Company Name field plus message wording (see that
      section for the exact classification rule). For a STANDARD
      (non-corporate) inquiry, use the shared
      knowledge base's literal "Standard quote template" VERBATIM,
      filling in only the bracketed placeholders - do not paraphrase or
      restructure it. For a CORPORATE/business inquiry, build the reply
      from the shared knowledge base's corporate quote structure and
      pricing column instead (we don't have Bonnie's literal corporate
      macro text on file yet; ticket #81048, a Tucson corporate
      team-building quote, is the reference shape). Quote the correct
      per-person price for their exact guest count and event type, state
      the minimum and deposit, include the "see what a party looks like"
      link, and offer that location's venue link(s) if on file (or the
      fallback line if not), signed off as "Bonnie Davila, Private Event
      Coordinator, Painting & Vino". This always stays an internal draft
      for Bonnie to review and send - never auto-sent. For a general
      public booking/date-availability question that ISN'T a private
      event quote, just point them to the booking page for their city
      and ask which date/venue they're interested in if not already
      stated. If a location was matched, include that location's direct
      event calendar link (see the "Direct link" line in the matched
      location's Booking section) rather than just saying "check our
      website."

  - name: event_sign_up_question
    match:
      any_keywords: ["how do i sign up", "signing up", "sign up for", "how do i register", "register for", "how do i attend", "looking for an event"]
    action: no_action
    force_human_review: false
    add_tags: ["faq_auto_answered", "booking_question"]

  - name: general_faq
    match:
      any_keywords: ["what is", "how does", "do you offer", "hours", "location", "price", "cost", "policy"]
    action: no_action
    force_human_review: false
    add_tags: ["faq_auto_answered"]

  - name: fallback_unclassified
    match: {}
    action: no_action
    force_human_review: false
    add_tags: ["needs_human", "unclassified"]
