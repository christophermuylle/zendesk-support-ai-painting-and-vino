# ---------------------------------------------------------------------------
# Support automation rules
# ---------------------------------------------------------------------------
# Rules are checked TOP TO BOTTOM against the latest customer message in the
# ticket. The first rule that matches wins - order matters, put your most
# specific / highest-priority rules first (e.g. "angry customer" before a
# generic FAQ catch-all).
#
# match:
#   any_keywords     - fires if the message contains ANY of these (case-insensitive)
#   all_keywords     - fires only if the message contains ALL of these
#   tags             - fires if the ticket already has any of these Zendesk tags
#
# action: solve | pending | escalate | no_action | order_confirmation
#   solve               - AI answers the question and the ticket is marked Solved
#   pending             - AI replies (usually asking for info) and ticket goes to
#                         Pending, i.e. "waiting on the customer"
#   escalate            - ticket is left Open, tagged, and ALWAYS held for a human -
#                         even in auto mode. Use this for anything with money, legal,
#                         or brand-reputation risk.
#   no_action           - completely hands off: no AI call, no reply, no status
#                         change. Only tags are applied (if set). Use this for
#                         tickets that are out of scope entirely - e.g. locations
#                         you don't provide support for.
#   order_confirmation  - for automated "New order" notification tickets, not a
#                         real support question: no AI call, no reply of any
#                         kind (draft or auto mode). Sets the "Reason for
#                         Customer Contacting Us" field to Order Confirmation
#                         (which also auto-applies the order_confirmation tag),
#                         then Solves the ticket if the order total is > $0, or
#                         leaves it Open for Bonnie if it's $0/unparseable. See
#                         src/pipeline.ts's order_confirmation branch.
#
# force_human_review: true means this rule NEVER auto-sends, regardless of MODE.
# add_tags: tags to stamp on the ticket when this rule fires (for reporting).
# drafting_hint: extra instruction passed to the AI when it writes the reply.
#
# Matching runs against the ticket SUBJECT plus the latest customer message,
# so a location that only shows up in the subject line (e.g. from a
# location-specific contact form) is still caught.
# ---------------------------------------------------------------------------

rules:
  # No Painting and Vino locations have been identified as self-managed /
  # out of scope yet (unlike Wine and Canvas, which excludes several - see
  # that deployment's rules.yaml for the pattern). If that changes, add an
  # "out_of_scope_location" rule here the same way, as the very first rule
  # in this file, matching on the location's name the way locations.yaml
  # does, with action: no_action.

  # Automated "New order" notification tickets from the storefront - these
  # are order receipts Zendesk turns into tickets, not a real customer
  # question, so this is matched and handled first (Christopher's rule:
  # "Tickets with 'New order' in the subject line or in the description
  # should be set to 'Order Confirmation' and status set to 'solved' only
  # if the order total is greater than $0. If it is $0 leave it open for
  # Bonnie to handle." - no AI reply draft). See action doc above.
  - name: new_order_confirmation
    match:
      any_keywords: ["new order"]
    action: order_confirmation
    force_human_review: false

  - name: refund_or_cancellation_request
    match:
      any_keywords: ["refund", "cancel my", "cancellation", "money back", "chargeback"]
    action: escalate
    force_human_review: true
    add_tags: ["needs_human", "refund_request"]
    drafting_hint: >
      Acknowledge the request and let them know a team member will follow up
      shortly to process it. Do NOT promise a refund or cancellation yourself.

  - name: angry_or_upset_customer
    match:
      any_keywords: ["unacceptable", "furious", "scam", "lawsuit", "terrible experience", "worst"]
    action: escalate
    force_human_review: true
    add_tags: ["needs_human", "upset_customer"]
    drafting_hint: >
      Be warm and empathetic, apologize for the frustration, and say a team
      member is personally looking into it. Do not try to resolve the
      complaint yourself.

  - name: licensee_recruitment_inquiry
    match:
      any_keywords: ["become a licensee", "open a franchise", "start my own", "how do i become", "territory"]
    action: pending
    force_human_review: false
    add_tags: ["licensee_lead"]
    drafting_hint: >
      Thank them for their interest and direct them to apply at
      paintingandvino.com/application/ (more info at
      paintingandvino.com/become-a-painting-and-vino-licensee/). Do NOT
      state specific terms like revenue split, fees, or territorial
      exclusivity - those aren't confirmed for this reply and should come
      from a human ("a Painting & Vino associate will follow up with the
      next steps" per our standard reply).

  - name: groupon_or_promo_code
    match:
      any_keywords: ["groupon", "livingsocial", "living social", "voucher", "bogo", "buy one get one", "promo code", "discount code"]
    action: solve
    force_human_review: false
    add_tags: ["promo_code_question"]
    drafting_hint: >
      Answer from the Promo codes, Groupon & BOGO section of the
      knowledge base. If the customer is reporting a code that won't
      apply/isn't working (rather than asking how Groupons/BOGO work in
      general), don't try to fix it yourself - ask for their name, the
      code, and the class details, and note a human will follow up
      (switch to pending in that case, not solve).

  - name: event_booking_question
    match:
      any_keywords: ["book an event", "book a class", "private event", "date availability", "how do i book"]
    action: pending
    force_human_review: false
    add_tags: ["booking_question"]
    drafting_hint: >
      Point them to the booking page for their city and ask which date/venue
      they're interested in if not already stated, so we can confirm
      availability.

  - name: general_faq
    match:
      any_keywords: ["what is", "how does", "do you offer", "hours", "location", "price", "cost", "policy"]
    action: solve
    force_human_review: false
    add_tags: ["faq_auto_answered"]
    drafting_hint: >
      Answer directly and completely from the knowledge base. If the
      knowledge base doesn't clearly cover it, do NOT guess - fall back to
      pending and ask a clarifying question instead.

  - name: fallback_unclassified
    match: {}
    action: pending
    force_human_review: true
    add_tags: ["needs_human", "unclassified"]
    drafting_hint: >
      Draft a best-effort helpful reply, but this ticket type isn't covered
      by a specific rule yet - flag it for a human to review and, if it's a
      recurring pattern, ask Christopher to add a rule for it.
